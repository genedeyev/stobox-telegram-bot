      pattern: "burn-and-mint, 1:1"
      destination_chain: "Base"
      burn_window_opens: "2026-07-20"
      burns_count_from: "2026-07-20"
      # Last eligible instant: 14 Sep 2026 23:59:59 UTC. Phrase it as the site
      # does: "burned before 15 September 2026".
