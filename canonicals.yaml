    # 15 Sep 2026 00:00 UTC. Only the claim period is live now.
    what: "Utility token issued by Stobox Innovations Ltd. on Base"
    issuer: "Stobox Innovations Ltd., a BVI Business Company, wholly owned by Stobox Technologies Inc. Not licensed or registered with the BVI Financial Services Commission."
    chain: "Base"
    chain_id: 8453
    contract: "0xe0c0F44A84CC4a60206360006ebA237a5e8fC2dd"
    claim_contract: "0xec5B3e512de13cb5DdFD84B2DF3167230F2e66a4"
    pool:
