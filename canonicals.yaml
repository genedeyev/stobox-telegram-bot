    supply: "Contract cap 250,000,000 STBU, which no one can raise. The issuance the company has determined is 216,563,456 STBU."
    pages:
      record: "https://www.stobox.io/stbu"
      security: "https://www.stobox.io/stbu/security"
      safety: "https://www.stobox.io/stbu/safety"
    legacy:
