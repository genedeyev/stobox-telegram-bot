      pool_id: "0x28bd1d1afcc57d766c5d1c5c38bd8beb376a0c98de719460cdcef60900f7b8b5"
      rule: "The only pool deployed by the issuer. Any other contract or pool carrying the STBU name was not deployed by Stobox Innovations Ltd. How to tell them apart: https://www.stobox.io/stbu/safety"
